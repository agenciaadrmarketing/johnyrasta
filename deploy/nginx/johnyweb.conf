# /etc/nginx/sites-available/johnyweb.conf
# Um vhost para o endereço PROVISÓRIO e, no dia da virada, também para app.johnyweb.com (mesmo bloco).
# Substitua PROVISORIO.EXEMPLO pelo host provisório. Os certificados vêm do certbot.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  listen [::]:80;
  server_name PROVISORIO.EXEMPLO;      # acrescente app.johnyweb.com no dia da virada
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name PROVISORIO.EXEMPLO;      # acrescente app.johnyweb.com no dia da virada
  ssl_certificate     /etc/letsencrypt/live/PROVISORIO.EXEMPLO/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/PROVISORIO.EXEMPLO/privkey.pem;

  # Formulários e coleta têm corpo pequeno; a aplicação limita a 32 KB. Corte antes.
  client_max_body_size 64k;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # O limite por IP da aplicação usa o PRIMEIRO valor de X-Forwarded-For: aqui ele é SOBRESCRITO
    # com o endereço real da conexão (não acrescentado), senão qualquer cliente forja o cabeçalho.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }
}
